name: cloud-analytics

services:
  cassandra:
    image: cassandra:4.1
    profiles: ["local"]
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: cloud-analytics
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  pipeline:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file:
      - ../config/.env
    environment:
      CASSANDRA_HOST: cassandra
      DATALAKE_PATH: /app/data/datalake
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
      - ../pyproject.toml:/app/pyproject.toml:ro
      - ../data:/app/data
      - ../secrets:/app/secrets
      - ../evidence:/app/evidence
    depends_on:
      cassandra:
        condition: service_healthy
        required: false

volumes:
  cassandra-data:
